services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    image: mohammadreza2005/todo-backend:latest
    ports:
      - "8000:3000"
    depends_on:
      - db
    env_file:
      - .env

  frontend:
    image: mohammadreza2005/todo-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data: